name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install --yes bats
      - name: Confirm the gate prerequisites
        run: |
          shellcheck --version
          jq --version
          bats --version
      - name: Run verify.sh
        run: ./verify.sh
      - name: Run the bats tests
        run: bats tests/
